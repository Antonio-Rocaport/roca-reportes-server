<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Mantenimiento - Roca Port</title>
    <!-- Carga de librerías oficiales para PDF y Firmas -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: #ffffff; width: 100%; max-width: 850px; padding: 30px; border-top: 5px solid #0056b3; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eaeaea; padding-bottom: 15px; margin-bottom: 25px; }
        .logo-area { font-weight: bold; font-size: 24px; color: #0056b3; display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 45px; object-fit: contain; }
        .meta-info { font-size: 12px; color: #666; text-align: right; }
        h2 { color: #333; margin-top: 0; font-size: 22px; }
        .subtitle { color: #666; font-size: 13px; margin-top: -15px; margin-bottom: 25px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
        label.required::after { content: " *"; color: #dc3545; }
        input[type="text"], input[type="date"], select, textarea { padding: 8px 12px; border: 1px solid #cccccc; border-radius: 4px; font-size: 14px; background: #fafafa; }
        input:focus, select:focus, textarea:focus { border-color: #0056b3; outline: none; background: #fff; }
        .checkbox-group { display: flex; gap: 15px; padding: 5px 0; flex-wrap: wrap; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 14px; color: #333; }
        .section-title { background: #f8f9fa; padding: 8px 12px; font-size: 16px; font-weight: bold; color: #0056b3; border-left: 4px solid #0056b3; margin: 30px 0 15px 0; display: flex; align-items: center; gap: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th { background: #0056b3; color: white; padding: 10px; text-align: left; font-weight: 600; }
        td { border: 1px solid #eaeaea; padding: 8px; }
        .col-num { width: 50px; text-align: center; font-weight: bold; color: #666; }
        .col-act { width: 60%; }
        .col-est { width: 25%; }
        .col-hh { width: 15%; }
        .photo-uploader { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .photo-box { border: 1px dashed #cccccc; padding: 15px; border-radius: 4px; text-align: center; background: #fafafa; }
        .photo-box input { font-size: 12px; width: 100%; }
        .signature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .signature-area { border: 1px solid #cccccc; border-radius: 4px; background: #fff; position: relative; margin-bottom: 5px; }
        canvas { width: 100%; height: 130px; display: block; background: #ffffff; }
        .btn-clear { background: #6c757d; color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; margin-bottom: 10px; }
        .btn-clear:hover { background: #5a6268; }
        .actions-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 40px; border-top: 1px solid #eaeaea; padding-top: 20px; }
        .btn-main { padding: 12px; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; transition: background 0.2s; }
        .btn-save-local { background: #28a745; }
        .btn-save-local:hover { background: #218838; }
        .btn-load-local { background: #17a2b8; }
        .btn-load-local:hover { background: #138496; }
        .btn-submit { background: #dc3545; grid-column: span 2; padding: 14px; font-size: 16px; }
        .btn-submit:hover { background: #c82333; }
        .btn-main:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="form-container" id="reporte-formulario">
    <div class="header">
        <div class="logo-area">
            <!-- Token CORS añadido para renderizar imágenes enlazadas externas -->
            <img src="https://onrender.com" crossorigin="anonymous" class="logo-img" alt="roca port">
            <span>Roca Port</span>
        </div>
        <div class="meta-info">
            <strong>⚙ MDA47</strong><br>
            Completo en campo • Técnico
        </div>
    </div>

    <h2># Reporte Mantenimiento</h2>
    <div class="subtitle">Complete cuidadosamente todos los campos requeridos.</div>

    <div class="grid-2">
        <div class="form-group">
            <label class="required">No. Reporte</label>
            <input type="text" id="no_reporte" required placeholder="Ej: ms-e-a-01">
        </div>
        <div class="form-group">
            <label class="required">Fecha</label>
            <input type="date" id="fecha" required>
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label class="required">Responsable (Mecánico)</label>
            <input type="text" id="responsable" required placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label class="required">Supervisor</label>
            <input type="text" id="supervisor" required placeholder="Nombre completo">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label class="required">Tag Equipo</label>
            <input type="text" id="tag_equipo" required placeholder="Ej: GAEG-01">
        </div>
        <div class="form-group">
            <label>Cliente</label>
            <input type="text" id="cliente" placeholder="HLB, Interno, etc.">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label class="required">Tipo Mantenimiento</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" name="tipo_mant" value="Preventivo"> Preventivo</label>
                <label class="checkbox-item"><input type="checkbox" name="tipo_mant" value="Correctivo"> Correctivo</label>
                <label class="checkbox-item"><input type="checkbox" name="tipo_mant" value="Requerido"> Requerido</label>
            </div>
        </div>
        <div class="form-group">
            <label class="required">Disciplina</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Mecánico"> Mecánico</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Eléctrico"> Eléctrico</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="A/C"> A/C</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Hidráulico"> Hidráulico</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Neumático"> Neumático</label>
            </div>
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>HH Asignadas</label>
            <input type="text" id="hh_asignadas" placeholder="0">
        </div>
        <div class="form-group">
            <label>HH Ejecutadas</label>
            <input type="text" id="hh_ejecutadas" placeholder="0">
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
        <label class="required">Descripción del Trabajo</label>
        <textarea id="descripcion_trabajo" rows="4" required placeholder="Detalle las tareas realizadas..."></textarea>
    </div>

    <div class="section-title">📋 Actividades Realizadas</div>
    <table>
        <thead>
            <tr>
                <th class="col-num">#</th>
                <th class="col-act">Actividad</th>
                <th class="col-est">Estado</th>
                <th class="col-hh">HH</th>
            </tr>
        </thead>
        <tbody id="tabla-actividades">
            <!-- Se generan las 6 filas del reporte original -->
            <script>
                for(let i=1; i<=6; i++) {
                    document.write(`
                        <tr>
                            <td class="col-num">${i}</td>
                            <td><input type="text" id="act_desc_${i}" style="width:100%; border:none; background:transparent;" placeholder="Descripción de actividad..."></td>
                            <td>
                                <select id="act_est_${i}" style="width:100%;">
                                    <option value="">-- Seleccionar --</option>
                                    <option value="Completada">✓ Completada</option>
                                    <option value="Parcial">◐ Parcial</option>
                                    <option value="Pendiente">✗ Pendiente</option>
                                </select>
                            </td>
                            <td><input type="text" id="act_hh_${i}" style="width:100%; border:none; background:transparent; text-align:center;" placeholder="0"></td>
                        </tr>
                    `);
                }
            </script>
        </tbody>
    </table>

    <div class="section-title">📷 Fotos del Mantenimiento (máx 4)</div>
    <div class="photo-uploader">
