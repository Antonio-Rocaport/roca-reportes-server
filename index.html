<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Mantenimiento - Roca Port</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: #ffffff; width: 100%; max-width: 800px; padding: 30px; border-top: 5px solid #0056b3; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eaeaea; padding-bottom: 15px; margin-bottom: 25px; }
        .logo-area { font-weight: bold; font-size: 24px; color: #0056b3; }
        .meta-info { font-size: 12px; color: #666; text-align: right; }
        h2 { color: #333; margin-top: 0; font-size: 22px; }
        .subtitle { color: #666; font-size: 13px; margin-top: -15px; margin-bottom: 25px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
        label.required::after { content: " *"; color: #dc3545; }
        input[type="text"], input[type="date"], select, textarea { padding: 8px 12px; border: 1px solid #cccccc; border-radius: 4px; font-size: 14px; background: #fafafa; width: 100%; }
        .checkbox-group { display: flex; gap: 15px; padding: 5px 0; flex-wrap: wrap; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .section-title { background: #f8f9fa; padding: 8px 12px; font-size: 16px; font-weight: bold; color: #0056b3; border-left: 4px solid #0056b3; margin: 30px 0 15px 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; table-layout: fixed; }
        th { background: #0056b3; color: white; padding: 10px; text-align: left; }
        td { border: 1px solid #eaeaea; padding: 8px; }
        .signature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .signature-area { border: 1px solid #cccccc; border-radius: 4px; background: #fff; height: 130px; }
        canvas { width: 100%; height: 100%; display: block; }
        .btn-clear { background: #6c757d; color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; margin-top: 5px; }
        .actions-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 40px; }
        .btn-main { padding: 12px; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; text-align: center; }
        .btn-save-local { background: #28a745; }
        .btn-load-local { background: #17a2b8; }
        .btn-submit { background: #dc3545; grid-column: span 2; padding: 14px; font-size: 16px; }

        /* Estilos clave para obligar el encuadre correcto en la hoja tamaño carta */
        @media print {
            body { padding: 0; background: none; }
            .form-container { width: 100% !important; max-width: 100% !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
            .actions-bar, .btn-clear { display: none !important; }
        }
    </style>
</head>
<body>

<div class="form-container" id="reporte-formulario">
    <div class="header">
        <div class="logo-area">Roca Port</div>
        <div class="meta-info"><strong>⚙ MDA47</strong><br>Completo en campo • Técnico</div>
    </div>

    <h2># Reporte Mantenimiento</h2>
    <div class="subtitle">Complete cuidadosamente todos los campos requeridos.</div>

    <div class="grid-2">
        <div class="form-group"><label class="required">No. Reporte</label><input type="text" id="no_reporte" required placeholder="Ej: ms-e-a-01"></div>
        <div class="form-group"><label class="required">Fecha</label><input type="date" id="fecha" required></div>
    </div>

    <div class="grid-2">
        <div class="form-group"><label class="required">Responsable (Mecánico)</label><input type="text" id="responsable" required></div>
        <div class="form-group"><label class="required">Supervisor</label><input type="text" id="supervisor" required></div>
    </div>

    <div class="grid-2">
        <div class="form-group"><label class="required">Tag Equipo</label><input type="text" id="tag_equipo" required></div>
        <div class="form-group"><label>Cliente</label><input type="text" id="cliente"></div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label class="required">Tipo Mantenimiento</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" name="tipo_mant" value="Preventivo"> Preventivo</label>
                <label class="checkbox-item"><input type="checkbox" name="tipo_mant" value="Correctivo"> Correctivo</label>
                <label class="checkbox-item"><input type="checkbox" name="tipo_mant" value="Requerido"> Requerido</label>
            </div>
        </div>
        <div class="form-group">
            <label class="required">Disciplina</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Mecánico"> Mecánico</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Eléctrico"> Eléctrico</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="A/C"> A/C</label>
                <label class="checkbox-item"><input type="checkbox" name="disc" value="Hidráulico"> Hidráulico</label>
            </div>
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group"><label>HH Asignadas</label><input type="text" id="hh_asignadas" placeholder="0"></div>
        <div class="form-group"><label>HH Ejecutadas</label><input type="text" id="hh_ejecutadas" placeholder="0"></div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
        <label class="required">Descripción del Trabajo</label>
        <textarea id="descripcion_trabajo" rows="3" required></textarea>
    </div>

    <div class="section-title">📋 Actividades Realizadas</div>
    <table>
        <thead>
            <tr>
                <th style="width: 40px; text-align: center;">#</th>
                <th style="width: 60%;">Actividad</th>
                <th style="width: 25%;">Estado</th>
                <th style="width: 15%; text-align: center;">HH</th>
            </tr>
        </thead>
        <tbody>
            <script>
                for(let i=1; i<=6; i++) {
                    document.write(`
                        <tr>
                            <td style="text-align: center; font-weight: bold; color: #666;">${i}</td>
                            <td><input type="text" id="act_desc_${i}" style="border:none; background:transparent;" placeholder="Descripción..."></td>
                            <td>
                                <select id="act_est_${i}">
                                    <option value="">-- Seleccionar --</option>
                                    <option value="Completada">✓ Completada</option>
                                    <option value="Parcial">◐ Parcial</option>
                                    <option value="Pendiente">✗ Pendiente</option>
                                </select>
                            </td>
                            <td><input type="text" id="act_hh_${i}" style="border:none; background:transparent; text-align:center;" placeholder="0"></td>
                        </tr>
                    `);
                }
            </script>
        </tbody>
    </table>

    <div class="section-title">✍ Firmas Requeridas</div>
    <div class="signature-grid">
        <div>
            <label class="required">Firma Mecánico</label>
            <div class="signature-area"><canvas id="canvas-mecanico"></canvas></div>
            <button class="btn-clear" onclick="padMecanico.clear()">Limpiar</button>
        </div>
        <div>
            <label class="required">Firma Supervisor</label>
            <div class="signature-area"><canvas id="canvas-supervisor"></canvas></div>
            <button class="btn-clear" onclick="padSupervisor.clear()">Limpiar</button>
        </div>
    </div>
    
    <div style="margin-top: 15px; margin-bottom: 20px;">
        <label class="required">Firma: Aceptó Mantenimiento</label>
        <input type="text" id="nombre_acepto" placeholder="Nombre de quien acepta" style="margin-bottom:10px; max-width: 400px;">
        <div class="signature-area" style="max-width: 400px;"><canvas id="canvas-acepto"></canvas></div>
        <button class="btn-clear" onclick="padAcepto.clear()">Limpiar</button>
    </div>

    <div class="actions-bar">
        <button class="btn-main btn-save-local" onclick="guardarLocal()">💾 Guardar Local</button>
        <button class="btn-main btn-load-local" onclick="cargarLocal()">📂 Cargar</button>
        <button class="btn-main btn-submit" id="btn-enviar" onclick="procesarYEnviarPDF()">📄 Exportar a PDF y Subir a Drive</button>
    </div>
</div>

<script>
    let padMecanico, padSupervisor, padAcepto;
    
    function inicializarFirmas() {
        padMecanico = new SignaturePad(document.getElementById('canvas-mecanico'));
        padSupervisor = new SignaturePad(document.getElementById('canvas-supervisor'));
        padAcepto = new SignaturePad(document.getElementById('canvas-acepto'));
    }

    function ajustarCanvas() {
