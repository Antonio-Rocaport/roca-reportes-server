<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Mantenimiento Campo - Roca Port MDA47</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 10px; }
        .container { max-width: 650px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* HEADER CON LOGOS */
        .header { background: white; padding: 15px; border-bottom: 3px solid #003d82; text-align: center; }
        .logo-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
        .logo-roca { 
            font-weight: bold; 
            color: #003d82; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 5px;
        }
        .dot-logo { width: 16px; height: 16px; background: #003d82; border-radius: 0 0 16px 0; }
        .logo-mda { 
            font-weight: bold; 
            color: #0d9488; 
            font-size: 14px;
        }
        .header h1 { color: #003d82; font-size: 18px; margin: 8px 0; }
        
        .form-content { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 5px; font-size: 13px; }
        input[type="text"], input[type="date"], input[type="number"], textarea, select { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            font-size: 13px; 
        }
        textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
        .checkbox-group label { margin: 0; display: flex; align-items: center; font-weight: normal; }
        input[type="checkbox"] { margin-right: 5px; width: 16px; height: 16px; cursor: pointer; }
        
        /* TABLA DE ACTIVIDADES */
        .table-section { margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 4px; border: 1px solid #ddd; }
        .table-section h3 { color: #003d82; font-size: 14px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #003d82; color: white; padding: 8px; text-align: left; font-weight: bold; }
        td { padding: 8px; border-bottom: 1px solid #ddd; }
        tr:nth-child(even) { background: #f0f0f0; }
        input.table-input { width: 100%; padding: 4px; border: 1px solid #ddd; border-radius: 2px; font-size: 11px; }
        
        /* FOTOS */
        .photo-section { margin-top: 20px; }
        .photo-input { margin-bottom: 15px; }
        .photo-label { font-weight: bold; margin-bottom: 5px; }
        .photo-preview { width: 100%; height: 150px; border: 2px solid #ddd; border-radius: 4px; object-fit: cover; margin-bottom: 5px; }
        
        /* FIRMAS */
        .signatures-section { margin-top: 20px; padding-top: 20px; border-top: 2px solid #003d82; }
        .signatures-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .signature-block { }
        .signature-label { font-weight: bold; color: #003d82; margin-bottom: 8px; font-size: 13px; }
        canvas { 
            border: 2px solid #ddd; 
            border-radius: 4px; 
            display: block; 
            width: 100%; 
            height: 100px; 
            cursor: crosshair; 
            background: white; 
            touch-action: none; 
        }
        .btn-clear-sig { 
            background-color: #6c757d; 
            color: white; 
            padding: 6px 10px; 
            font-size: 11px; 
            border: none; 
            border-radius: 3px; 
            cursor: pointer; 
            margin-top: 5px; 
        }
        .btn-clear-sig:hover { background-color: #545b62; }
        
        /* BOTONES PRINCIPALES */
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { 
            padding: 10px; 
            font-size: 13px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.3s; 
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-save:hover { background-color: #218838; }
        .btn-load { background-color: #007bff; color: white; }
        .btn-load:hover { background-color: #0056b3; }
        .btn-pdf { background-color: #dc3545; color: white; width: 100%; margin-top: 10px; }
        .btn-pdf:hover { background-color: #c82333; }
        
        .status-msg { 
            padding: 10px; 
            margin-top: 10px; 
            border-radius: 4px; 
            text-align: center; 
            font-weight: bold; 
            display: none; 
        }
        .status-msg.success { background-color: #d4edda; color: #155724; }
        .status-msg.error { background-color: #f8d7da; color: #721c24; }
        
        .required-mark { color: #dc3545; }

        /* ⭐ ESTILOS PARA PDF: Evitar saltos de página feos */
        table { 
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        .table-section { 
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        .signatures-grid { 
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        .photo-section { 
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        .form-group { 
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        .form-row { 
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        .checkbox-group {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        
        /* Evitar página en blanco al inicio */
        #reporteForm {
            page-break-before: avoid !important;
            break-before: avoid !important;
            margin-top: 0 !important;
            padding-top: 0 !important;
        }
        
        /* Asegurar que los logos se rendericen */
        img, svg {
            max-width: 100%;
            page-break-inside: avoid !important;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER CON LOGOS -->
        <div class="header">
            <div class="logo-row">
                <div class="logo-roca">
                    <div class="dot-logo"></div>
                    roca port
                </div>
                <div class="logo-mda">⚙ MDA47</div>
            </div>
            <h1>Reporte Mantenimiento</h1>
            <p style="color: #666; font-size: 12px;">Completar en campo • Técnico</p>
        </div>

        <div class="form-content">
            <form id="reporteForm">
                <!-- DATOS BÁSICOS -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="repNo">No. Reporte <span class="required-mark">*</span></label>
                        <input type="text" id="repNo" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha">Fecha <span class="required-mark">*</span></label>

                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="responsable">Responsable (Mecánico) <span class="required-mark">*</span></label>
                        <input type="text" id="responsable" placeholder="Nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="supervisor">Supervisor <span class="required-mark">*</span></label>
                        <input type="text" id="supervisor" placeholder="Nombre" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tag">Tag Equipo <span class="required-mark">*</span></label>
                        <input type="text" id="tag" placeholder="Ej: G-EQ-01" required>
                    </div>
                    <div class="form-group">
                        <label for="cliente">Cliente</label>
                        <input type="text" id="cliente" placeholder="HLB, Interno, etc.">
                    </div>
                </div>

                <!-- TIPO Y DISCIPLINA -->
                <div class="form-group">
                    <label>Tipo Mantenimiento <span class="required-mark">*</span></label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="tipo" value="Preventivo"> Preventivo</label>
                        <label><input type="checkbox" name="tipo" value="Correctivo"> Correctivo</label>
                        <label><input type="checkbox" name="tipo" value="Requerido"> Requerido</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Disciplina <span class="required-mark">*</span></label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="disciplina" value="Mecánico"> Mecánico</label>
                        <label><input type="checkbox" name="disciplina" value="Eléctrico"> Eléctrico</label>
                        <label><input type="checkbox" name="disciplina" value="A/C"> A/C</label>
                        <label><input type="checkbox" name="disciplina" value="Hidráulico"> Hidráulico</label>
                        <label><input type="checkbox" name="disciplina" value="Neumático"> Neumático</label>
                    </div>
                </div>

                <!-- HORAS Y DESCRIPCIÓN -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="hhAsig">HH Asignadas</label>
                        <input type="number" id="hhAsig" placeholder="0" step="0.5">
                    </div>
                    <div class="form-group">
                        <label for="hhEjec">HH Ejecutadas</label>
                        <input type="number" id="hhEjec" placeholder="0" step="0.5">
                    </div>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción del Trabajo <span class="required-mark">*</span></label>
                    <textarea id="descripcion" placeholder="¿Qué se hizo?" required></textarea>
                </div>

                <!-- TABLA DE ACTIVIDADES -->
                <div class="table-section">
                    <h3>📋 Actividades Realizadas</h3>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 5%;">#</th>
                                <th style="width: 60%;">Actividad</th>
                                <th style="width: 20%;">Estado</th>
                                <th style="width: 15%;">HH</th>
                            </tr>
                        </thead>
                        <tbody id="activitiesTable">
                            <tr>
                                <td>1</td>
                                <td><input type="text" class="table-input activity-name" placeholder="Ej: Cambio aceite"></td>
                                <td>
                                    <select class="table-input activity-status">
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Completada">✓ Completada</option>
                                        <option value="Parcial">◐ Parcial</option>
                                        <option value="Pendiente">✗ Pendiente</option>
                                    </select>
                                </td>
                                <td><input type="number" class="table-input activity-hh" placeholder="0" step="0.5"></td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td><input type="text" class="table-input activity-name" placeholder="Ej: Revisión filtros"></td>
                                <td>
                                    <select class="table-input activity-status">
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Completada">✓ Completada</option>
                                        <option value="Parcial">◐ Parcial</option>
                                        <option value="Pendiente">✗ Pendiente</option>
                                    </select>
                                </td>
                                <td><input type="number" class="table-input activity-hh" placeholder="0" step="0.5"></td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td><input type="text" class="table-input activity-name" placeholder="Ej: Calibración"></td>
                                <td>
                                    <select class="table-input activity-status">
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Completada">✓ Completada</option>
                                        <option value="Parcial">◐ Parcial</option>
                                        <option value="Pendiente">✗ Pendiente</option>
                                    </select>
                                </td>
                                <td><input type="number" class="table-input activity-hh" placeholder="0" step="0.5"></td>
                            </tr>
                            <tr>
                                <td>4</td>
                                <td><input type="text" class="table-input activity-name" placeholder="Ej: Prueba funcional"></td>
                                <td>
                                    <select class="table-input activity-status">
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Completada">✓ Completada</option>
                                        <option value="Parcial">◐ Parcial</option>
                                        <option value="Pendiente">✗ Pendiente</option>
                                    </select>
                                </td>
                                <td><input type="number" class="table-input activity-hh" placeholder="0" step="0.5"></td>
                            </tr>
                            <tr>
                                <td>5</td>
                                <td><input type="text" class="table-input activity-name" placeholder="Ej: Limpieza y orden"></td>
                                <td>
                                    <select class="table-input activity-status">
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Completada">✓ Completada</option>
                                        <option value="Parcial">◐ Parcial</option>
                                        <option value="Pendiente">✗ Pendiente</option>
                                    </select>
                                </td>
                                <td><input type="number" class="table-input activity-hh" placeholder="0" step="0.5"></td>
                            </tr>
                            <tr>
                                <td>6</td>
                                <td><input type="text" class="table-input activity-name" placeholder="Ej: Documentación"></td>
                                <td>
                                    <select class="table-input activity-status">
                                        <option value="">-- Seleccionar --</option>
                                        <option value="Completada">✓ Completada</option>
                                        <option value="Parcial">◐ Parcial</option>
                                        <option value="Pendiente">✗ Pendiente</option>

                            </tr>

                    </table>
                </div>

                <!-- FOTOS -->
                <div class="photo-section">
                    <h3 style="color: #003d82; margin-bottom: 10px; font-size: 14px;">📷 Fotos del Mantenimiento (máx 4)</h3>
                    <div class="photo-input">
                        <div class="photo-label">Foto 1:</div>
                        <input type="file" id="foto1" accept="image/*" capture="environment">
                        <img id="preview1" class="photo-preview" style="display:none;">
                    </div>
                    <div class="photo-input">
                        <div class="photo-label">Foto 2:</div>
                        <input type="file" id="foto2" accept="image/*" capture="environment">
                        <img id="preview2" class="photo-preview" style="display:none;">
                    </div>
                    <div class="photo-input">
                        <div class="photo-label">Foto 3:</div>
                        <input type="file" id="foto3" accept="image/*" capture="environment">
                        <img id="preview3" class="photo-preview" style="display:none;">
                    </div>
                    <div class="photo-input">
                        <div class="photo-label">Foto 4:</div>
                        <input type="file" id="foto4" accept="image/*" capture="environment">
                        <img id="preview4" class="photo-preview" style="display:none;">
                    </div>
                </div>

                <!-- FIRMAS: MECÁNICO, SUPERVISOR, ACEPTACIÓN -->
                <div class="signatures-section">
                    <h2 style="color: #003d82; font-size: 15px; margin-bottom: 15px;">✍️ Firmas Requeridas</h2>
                    
                    <div class="signatures-grid">
                        <!-- Firma Mecánico -->
                        <div class="signature-block">
                            <div class="signature-label">Firma Mecánico <span class="required-mark">*</span></div>
                            <canvas id="firmaMecanico"></canvas>
                            <button type="button" class="btn-clear-sig" onclick="limpiarFirma('firmaMecanico')">Limpiar</button>
                        </div>

                        <!-- Firma Supervisor -->
                        <div class="signature-block">
                            <div class="signature-label">Firma Supervisor <span class="required-mark">*</span></div>
                            <canvas id="firmaSupervisor"></canvas>
                            <button type="button" class="btn-clear-sig" onclick="limpiarFirma('firmaSupervisor')">Limpiar</button>
                        </div>
                    </div>

                    <!-- Firma de Aceptación (ancho completo) -->
                    <div class="signature-block" style="margin-top: 15px;">
                        <div class="signature-label">Firma: Aceptó Mantenimiento <span class="required-mark">*</span></div>
                        <input type="text" id="aceptaQuien" placeholder="Nombre de quien acepta" style="margin-bottom: 8px;">
                        <canvas id="firmaAceptacion"></canvas>
                        <button type="button" class="btn-clear-sig" onclick="limpiarFirma('firmaAceptacion')">Limpiar</button>
                    </div>
                </div>

                <!-- BOTONES -->
                <div class="button-group">
                    <button type="button" class="btn-save" onclick="guardarLocal()">💾 Guardar Local</button>
                    <button type="button" class="btn-load" onclick="cargarLocal()">📂 Cargar</button>
                </div>
                <button type="button" class="btn-pdf" onclick="exportarPDF()">📄 Exportar a PDF</button>
            </form>

            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script>
        // ⚙️ CONFIGURACIÓN DEL SERVIDOR
        // Cambiar esta URL cuando esté en Render
        const SERVER_URL = 'https://roca-reportes-server.onrender.com'; // Render producción
        // const SERVER_URL = 'http://localhost:5000'; // Local desarrollo
        
        // Inicializar canvas de firmas
        const canvases = ['firmaMecanico', 'firmaSupervisor', 'firmaAceptacion'];
        const ctxs = {};
        const isDrawingStates = {};

        canvases.forEach(canvasId => {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            ctxs[canvasId] = ctx;
            isDrawingStates[canvasId] = false;

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            canvas.addEventListener('mousedown', () => { isDrawingStates[canvasId] = true; });
            canvas.addEventListener('mouseup', () => { isDrawingStates[canvasId] = false; });
            canvas.addEventListener('mousemove', (e) => { if(isDrawingStates[canvasId]) dibujarEnCanvas(e, canvas, ctx); });

            canvas.addEventListener('touchstart', (e) => { isDrawingStates[canvasId] = true; e.preventDefault(); });
            canvas.addEventListener('touchend', () => { isDrawingStates[canvasId] = false; });
            canvas.addEventListener('touchmove', (e) => { if(isDrawingStates[canvasId]) dibujarEnCanvas(e, canvas, ctx); e.preventDefault(); });
        });

        function dibujarEnCanvas(e, canvas, ctx) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX ? e.clientX - rect.left : e.touches[0].clientX - rect.left;
            const y = e.clientY ? e.clientY - rect.top : e.touches[0].clientY - rect.top;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function limpiarFirma(canvasId) {
            const ctx = ctxs[canvasId];
            const canvas = document.getElementById(canvasId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Fotos
        ['foto1', 'foto2', 'foto3', 'foto4'].forEach((id, idx) => {
            document.getElementById(id).addEventListener('change', (e) => {
                const reader = new FileReader();
                reader.onload = () => {
                    document.getElementById(`preview${idx+1}`).src = reader.result;
                    document.getElementById(`preview${idx+1}`).style.display = 'block';
                };
                if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
            });
        });

        // Guardar
        function guardarLocal() {
            const activities = [];
            document.querySelectorAll('#activitiesTable tr').forEach((row, idx) => {
                const name = row.querySelector('.activity-name').value;
                const status = row.querySelector('.activity-status').value;
                const hh = row.querySelector('.activity-hh').value;
                if(name || status || hh) {
                    activities.push({ num: idx+1, name, status, hh });
                }
            });

            const datos = {
                repNo: document.getElementById('repNo').value,
                fecha: document.getElementById('fecha').value,
                responsable: document.getElementById('responsable').value,
                supervisor: document.getElementById('supervisor').value,
                tag: document.getElementById('tag').value,
                cliente: document.getElementById('cliente').value,
                tipo: Array.from(document.querySelectorAll('input[name="tipo"]:checked')).map(x => x.value),
                disciplina: Array.from(document.querySelectorAll('input[name="disciplina"]:checked')).map(x => x.value),
                hhAsig: document.getElementById('hhAsig').value,
                hhEjec: document.getElementById('hhEjec').value,
                descripcion: document.getElementById('descripcion').value,
                activities: activities,
                firmaMecanico: document.getElementById('firmaMecanico').toDataURL(),
                firmaSupervisor: document.getElementById('firmaSupervisor').toDataURL(),
                aceptaQuien: document.getElementById('aceptaQuien').value,
                firmaAceptacion: document.getElementById('firmaAceptacion').toDataURL(),
                fotos: []
            };
            ['foto1', 'foto2', 'foto3', 'foto4'].forEach((id, idx) => {
                const preview = document.getElementById(`preview${idx+1}`);
                if (preview.style.display !== 'none') datos.fotos.push(preview.src);
            });
            localStorage.setItem('reporte_' + Date.now(), JSON.stringify(datos));
            mostrarEstado('✅ Guardado localmente', 'success');
        }

        // Cargar
        function cargarLocal() {
            const keys = Object.keys(localStorage);
            if (keys.length === 0) { 
                mostrarEstado('❌ No hay reportes guardados', 'error');
                return;
            }
            const ultimo = keys[keys.length - 1];
            const datos = JSON.parse(localStorage.getItem(ultimo));
            
            document.getElementById('repNo').value = datos.repNo || '';
            document.getElementById('fecha').value = datos.fecha || '';
            document.getElementById('responsable').value = datos.responsable || '';
            document.getElementById('supervisor').value = datos.supervisor || '';
            document.getElementById('tag').value = datos.tag || '';
            document.getElementById('cliente').value = datos.cliente || '';
            document.getElementById('hhAsig').value = datos.hhAsig || '';
            document.getElementById('hhEjec').value = datos.hhEjec || '';
            document.getElementById('descripcion').value = datos.descripcion || '';
            document.getElementById('aceptaQuien').value = datos.aceptaQuien || '';
            
            datos.tipo.forEach(t => { document.querySelector(`input[name="tipo"][value="${t}"]`).checked = true; });
            datos.disciplina.forEach(d => { document.querySelector(`input[name="disciplina"][value="${d}"]`).checked = true; });
            
            // Cargar actividades
            if(datos.activities && datos.activities.length > 0) {
                const rows = document.querySelectorAll('#activitiesTable tr');
                datos.activities.forEach((act, idx) => {
                    if(rows[idx]) {
                        rows[idx].querySelector('.activity-name').value = act.name || '';
                        rows[idx].querySelector('.activity-status').value = act.status || '';
                        rows[idx].querySelector('.activity-hh').value = act.hh || '';
                    }
                });
            }
            
            // Cargar firmas
            ['firmaMecanico', 'firmaSupervisor', 'firmaAceptacion'].forEach(sigId => {
                const img = new Image();
                img.onload = () => {
                    const ctx = ctxs[sigId];
                    ctx.drawImage(img, 0, 0);
                };
                img.src = datos[sigId] || '';
            });
            
            // Cargar fotos
            datos.fotos.forEach((foto, idx) => {
                document.getElementById(`preview${idx+1}`).src = foto;
                document.getElementById(`preview${idx+1}`).style.display = 'block';
            });
            mostrarEstado('✅ Reporte cargado', 'success');
        }

        // Exportar a PDF y subir a Drive
        function exportarPDF() {
            try {
                // Validar campos requeridos
                const repNo = document.getElementById('repNo').value;
                const fecha = document.getElementById('fecha').value;
                const responsable = document.getElementById('responsable').value;
                const supervisor = document.getElementById('supervisor').value;
                const tag = document.getElementById('tag').value;
                
                if (!repNo || !fecha || !responsable || !supervisor || !tag) {
                    mostrarEstado('❌ Completa: No. Reporte, Fecha, Responsable, Supervisor y Tag Equipo', 'error');
                    return;
                }
                
                mostrarEstado('⏳ Generando y subiendo a Drive...', 'success');
                
                const element = document.getElementById('reporteForm');
                const opt = {
                    margin: [15, 15, 15, 15],
                    filename: `reporte_${repNo}.pdf`,
                    image: { type: 'jpeg', quality: 0.95 },
                    html2canvas: { 
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        windowHeight: 1400,
                        windowWidth: 816,
                        useCORS: true,
                        allowTaint: true
                    },
                    jsPDF: { 
                        orientation: 'portrait', 
                        unit: 'mm', 
                        format: 'letter',
                        compress: true
                    },
                    pagebreak: { 
                        mode: ['avoid-all', 'css', 'legacy'],
                        avoid: ['table', '.signatures-grid', '.photo-section']
                    }
                };
                
                setTimeout(() => {
                    html2pdf()
                        .set(opt)
                        .from(element)
                        .toPdf()
                        .get('pdf')
                        .then((pdfObj) => {
                            // Obtener PDF como data URL
                            const pdfDataUrl = pdfObj.output('dataurlstring');
                            
                            // Enviar al servidor Render
                            fetch('https://roca-reportes-server.onrender.com/api/upload-pdf', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    pdf: pdfDataUrl,
                                    filename: `reporte_${repNo}.pdf`
                                })
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.success) {
                                    mostrarEstado(`✅ ${data.message}`, 'success');
                                    // Limpiar formulario después de 2 segundos
                                    setTimeout(() => {
                                        document.getElementById('reporteForm').reset();
                                        ['firmaMecanico', 'firmaSupervisor', 'firmaAceptacion'].forEach(id => {
                                            limpiarFirma(id);
                                        });
                                    }, 2000);
                                } else {
                                    mostrarEstado(`❌ ${data.error}`, 'error');
                                }
                            })
                            .catch(err => {
                                console.error('Error al conectar servidor:', err);
                                mostrarEstado('⚠️ Servidor no disponible. ¿Está corriendo python en tu máquina?', 'error');
                            });
                        })
                        .catch((err) => {
                            console.error('Error al generar PDF:', err);
                            mostrarEstado('❌ Error al generar PDF. Revisa la consola.', 'error');
                        });
                }, 300);
            } catch (error) {
                console.error('Error:', error);
                mostrarEstado('❌ Error inesperado. Contacta con soporte.', 'error');
            }
        }

        // Estado
        function mostrarEstado(msg, tipo) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `status-msg ${tipo}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // Establecer fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();
        
        // Llenar datos de ejemplo para prueba rápida
        function llenarEjemplo() {
            document.getElementById('repNo').value = 'MDA47-' + Date.now();
            document.getElementById('fecha').valueAsDate = new Date();
            document.getElementById('responsable').value = 'Juan Daniel Salvador';
            document.getElementById('supervisor').value = 'Antonio E. Hernández';
            document.getElementById('tag').value = 'G-BOMBA-01';
            document.getElementById('cliente').value = 'HLB (Halliburton)';
            document.getElementById('hhAsig').value = '8';
            document.getElementById('hhEjec').value = '7.5';
            document.getElementById('descripcion').value = 'Mantenimiento preventivo de bomba centrífuga. Inspección de sellos, lubricación, alineación y pruebas de rendimiento.';
            document.getElementById('aceptaQuien').value = 'Jocelyn (HLB)';
            
            document.querySelector('input[name="tipo"][value="Preventivo"]').checked = true;
            document.querySelector('input[name="disciplina"][value="Mecánica"]').checked = true;
            
            mostrarEstado('✅ Datos de ejemplo cargados', 'success');
        }
    </script>
</body>
</html>
